# Environment the published annotations were produced in (Linux 5.15, 2026-10-14/15).
# Create it with PYTHONNOUSERSITE=1 exported: otherwise pip treats packages in ~/.local as installed and
# leaves them out of the environment.
# After creating it:  python -m satellome --install-fastan --install-tanbed --install-rust-tools
# then run workflow/check_env.sh — it compares tool versions and the FasTAN / tanbed source commits.
name: t2t_centromeres
channels: [conda-forge, bioconda]
dependencies:
  - python=3.10
  - blast=2.12.0
  - ucsc-twobitinfo
  - ucsc-twobittofa
  - pip
  - pip:
      - satellome==1.17.2
      - arraysplitter==1.7.4
      - numpy==1.26.4
      - pandas==2.3.3
      - PyYAML==6.0.3
      - zstandard==0.25.0
